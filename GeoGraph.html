<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Neon City - Ultimate Recovery</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap');
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Orbitron', sans-serif; cursor: none; }
        canvas { display: block; }
        #hud { position: absolute; top: 20px; left: 20px; color: #fff; pointer-events: none; z-index: 100; }
        .bar-label { font-size: 10px; color: #0ff; letter-spacing: 2px; margin-top: 10px; }
        .bar-container { width: 220px; height: 10px; background: rgba(255,255,255,0.1); border: 2px solid #333; margin-top: 4px; }
        .bar-inner { height: 100%; width: 0%; transition: 0.1s; }
        #prog-inner { background: linear-gradient(90deg, #0f0, #0ff); box-shadow: 0 0 10px #0ff; }
        #laser-inner { background: linear-gradient(90deg, #f0f, #fff); box-shadow: 0 0 15px #f0f; }
        #life-container { margin-top: 15px; font-size: 24px; color: #ff2e63; text-shadow: 0 0 10px #ff2e63; }
        #boss-hp-container {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            width: 70%; display: none; text-align: center;
        }
        #boss-hp-bar { width: 100%; height: 25px; background: #200; border: 3px solid #f00; margin-top: 5px; overflow: hidden; }
        #boss-hp-inner { width: 100%; height: 100%; background: #f00; box-shadow: 0 0 30px #f00; transition: width 0.1s; }
        #msg {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            color: #fff; font-size: 60px; font-weight: 900; text-shadow: 0 0 30px #f00; display: none;
        }
    </style>
</head>
<body>
    <div id="hud">
        <div class="bar-label">SECTOR DISTANCE</div>
        <div class="bar-container"><div id="prog-inner" class="bar-inner"></div></div>
        <div class="bar-label">OVERDRIVE CORE (Z)</div>
        <div class="bar-container"><div id="laser-inner" class="bar-inner"></div></div>
        <div id="life-container">❤️❤️❤️</div>
        <div id="score-text" style="font-size: 18px; margin-top: 10px; font-weight: 900;">STAGE: 1</div>
    </div>
    <div id="boss-hp-container">
        <div id="boss-name" style="color: #f00; font-weight: 900; letter-spacing: 10px; font-size: 24px;">BOSS: OMEGA</div>
        <div id="boss-hp-bar"><div id="boss-hp-inner"></div></div>
    </div>
    <div id="msg">WARNING</div>
    <canvas id="game"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: false });
const progInner = document.getElementById('prog-inner');
const laserInner = document.getElementById('laser-inner');
const bossHpInner = document.getElementById('boss-hp-inner');
const bossHpCont = document.getElementById('boss-hp-container');
const lifeCont = document.getElementById('life-container');
const msgEl = document.getElementById('msg');

let width, height, player, frame = 0, score = 0, stage = 1;
let gameSpeed = 12, shake = 0, boss = null;
let isGameOver = false, laserCharge = 0, isLaserFiring = false;
let enemies = [], bullets = [], particles = [], bgRects = [];
let keys = {};

const CFG = {
    G: 0.85, JUMP: -18, BOSS_SPAWN_DIST: 1200, STAGE_HEIGHT: 150, MOVE_SPEED: 9
};

class Player {
    constructor() { this.reset(); }
    reset() {
        this.x = 200; this.y = 0; this.w = 50; this.h = 60;
        this.dy = 0; this.jumps = 0; this.sliding = false;
        this.dashFrame = 0; this.lives = 3; this.invincible = 0;
    }
    update() {
        if(keys['KeyA'] || keys['ArrowLeft']) this.x -= CFG.MOVE_SPEED;
        if(keys['KeyD'] || keys['ArrowRight']) this.x += CFG.MOVE_SPEED;
        if(this.dashFrame > 0) { this.dashFrame--; this.x += 12; }
        if(this.invincible > 0) this.invincible--;
        if(this.x < 50) this.x = 50;
        if(this.x > width - 150) this.x = width - 150;

        this.dy += CFG.G;
        this.y += this.dy;
        const ground = height - CFG.STAGE_HEIGHT - (this.sliding ? 30 : 60);
        if (this.y >= ground) { this.y = ground; this.dy = 0; this.jumps = 0; }
    }
    draw() {
        ctx.save();
        if (this.invincible > 0 && frame % 10 < 5) ctx.globalAlpha = 0.3;
        ctx.translate(this.x, this.y);
        ctx.shadowBlur = (this.dashFrame > 0 || isLaserFiring) ? 40 : 20;
        ctx.shadowColor = isLaserFiring ? '#f0f' : '#0ff';
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, this.w, this.sliding ? 30 : 60);
        ctx.restore();
    }
}

class Boss {
    constructor() {
        this.w = 280; this.h = 280;
        this.x = width + 500; this.y = height/2 - this.h/2;
        this.hp = 500 * stage; this.maxHp = this.hp;
        this.hitTimer = 0; this.isDying = false; this.patternTimer = 0;
    }
    update() {
        if(this.isDying) { this.x += 25; return; }
        this.x += (width - 450 - this.x) * 0.05;
        this.y += (player.y - 120 - this.y) * 0.03;
        if(this.hitTimer > 0) this.hitTimer--;

        this.patternTimer++;
        if(this.patternTimer > 160) {
            this.patternTimer = 0;
            this.pattern = Math.random() < 0.5 ? 'spread' : 'homing';
        }
        if(this.pattern === 'spread' && frame % 30 === 0) {
            for(let i=-1; i<=1; i++) enemies.push({ x: this.x, y: this.y + 140, w: 35, h: 35, color: '#f00', vx: -8, vy: i*3, hp: 1 });
        }
        if(this.pattern === 'homing' && frame % 60 === 0) {
            enemies.push({ x: this.x, y: this.y + 140, w: 40, h: 40, color: '#ff0', vx: -6, vy: (player.y - (this.y+140))*0.02, hp: 1 });
        }
    }
    draw() {
        if(this.isDying) return;
        ctx.save();
        ctx.shadowBlur = 30; ctx.shadowColor = '#f00';
        ctx.strokeStyle = this.hitTimer > 0 ? '#fff' : '#f00';
        ctx.lineWidth = 10;
        ctx.strokeRect(this.x, this.y, this.w, this.h);
        ctx.fillStyle = 'rgba(255, 0, 0, 0.1)';
        ctx.fillRect(this.x, this.y, this.w, this.h);
        ctx.restore();
    }
}

function init() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    player = new Player(); boss = null;
    enemies = []; bullets = []; particles = []; 
    bgRects = Array.from({length: 15}, () => ({ x: Math.random()*width, y: Math.random()*height, w: Math.random()*200+50, h: Math.random()*200+50, s: Math.random()*5+2 }));
    score = 0; stage = 1; gameSpeed = 12; isGameOver = false; laserCharge = 0;
    bossHpCont.style.display = 'none'; updateLifeUI();
}

function updateLifeUI() { lifeCont.innerText = "❤️".repeat(player.lives) + "🖤".repeat(3 - player.lives); }

function handleBossDeath() {
    if(!boss || boss.isDying) return;
    boss.isDying = true; shake = 60; score += 400;
    createExplosion(boss.x + 140, boss.y + 140, '#fff', 80);
    bossHpCont.style.display = 'none';
    setTimeout(() => { boss = null; stage++; gameSpeed += 2; showMsg(`STAGE CLEAR`); }, 600);
}

function update() {
    if (isGameOver) return;
    frame++; score += (gameSpeed * 0.1);
    if (!isLaserFiring) laserCharge = Math.min(100, laserCharge + 0.15);
    
    progInner.style.width = (boss ? 100 : ((score % CFG.BOSS_SPAWN_DIST) / CFG.BOSS_SPAWN_DIST) * 100) + '%';
    laserInner.style.width = laserCharge + '%';
    document.getElementById('score-text').innerText = `STAGE: ${stage} | SCORE: ${Math.floor(score)}`;

    player.update();
    if(shake > 0) shake *= 0.85;

    bgRects.forEach(r => { r.x -= r.s; if(r.x + r.w < 0) r.x = width + 100; });

    if(!boss && (score % CFG.BOSS_SPAWN_DIST) > (CFG.BOSS_SPAWN_DIST - 10)) {
        boss = new Boss(); bossHpCont.style.display = 'block'; showMsg(`BOSS WARNING`);
    }
    if(boss) boss.update();

    if(!boss && frame % 40 === 0) {
        enemies.push({ x: width + 100, y: Math.random() > 0.5 ? height - CFG.STAGE_HEIGHT - 50 : height - CFG.STAGE_HEIGHT - 150, w: 45, h: 45, color: '#0ff', vx: -gameSpeed, vy: 0, hp: 1 });
    }

    bullets.forEach((b, bi) => {
        b.x += 25;
        if(boss && !boss.isDying && b.x > boss.x && b.x < boss.x + boss.w && b.y > boss.y && b.y < boss.y + boss.h) {
            boss.hp -= 15; boss.hitTimer = 5; bullets.splice(bi, 1);
            bossHpInner.style.width = (boss.hp / boss.maxHp * 100) + '%';
            if(boss.hp <= 0) handleBossDeath();
        }
        if(b.x > width) bullets.splice(bi, 1);
    });

    if(isLaserFiring && boss && !boss.isDying) {
        if(frame % 5 === 0) {
            boss.hp -= 20; bossHpInner.style.width = (boss.hp / boss.maxHp * 100) + '%';
            if(boss.hp <= 0) handleBossDeath();
        }
    }

    enemies.forEach((en, i) => {
        en.x += (en.vx || -gameSpeed); en.y += (en.vy || 0);
        if (Math.abs(player.x - en.x) < 40 && Math.abs(player.y - en.y) < 40 && player.invincible <= 0) {
            if(player.dashFrame > 0) enemies.splice(i, 1);
            else { player.lives--; player.invincible = 100; updateLifeUI(); if(player.lives <= 0) { isGameOver = true; showMsg("GAME OVER"); setTimeout(init, 2000); } }
        }
        if(en.x < -100) enemies.splice(i, 1);
    });
    particles.forEach((p, i) => { p.x += p.vx; p.y += p.vy; p.life -= 0.02; if(p.life <= 0) particles.splice(i, 1); });
}

function draw() {
    ctx.fillStyle = '#0a0a0f'; ctx.fillRect(0, 0, width, height);
    ctx.save();
    if(shake > 1) ctx.translate(Math.random()*shake - shake/2, Math.random()*shake - shake/2);

    // 배경 사각형들
    ctx.strokeStyle = '#1a1a2e'; ctx.lineWidth = 2;
    bgRects.forEach(r => ctx.strokeRect(r.x, r.y, r.w, r.h));

    // 바닥/천장 라인
    ctx.strokeStyle = `hsl(${(stage*60)%360}, 100%, 50%)`; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(0, height - CFG.STAGE_HEIGHT); ctx.lineTo(width, height - CFG.STAGE_HEIGHT); ctx.stroke();

    if(boss) boss.draw();
    enemies.forEach(en => { 
        ctx.fillStyle = en.color; ctx.shadowBlur = 15; ctx.shadowColor = en.color;
        ctx.fillRect(en.x, en.y, en.w, en.h); 
    });

    if(isLaserFiring) {
        ctx.shadowBlur = 40; ctx.shadowColor = '#f0f'; ctx.fillStyle = '#f0f';
        ctx.fillRect(player.x+50, player.y + (player.sliding?5:20), width, 30);
    }

    bullets.forEach(b => { ctx.fillStyle = '#fff'; ctx.fillRect(b.x, b.y, 30, 8); });
    particles.forEach(p => { ctx.globalAlpha = p.life; ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.size, p.size); });
    ctx.globalAlpha = 1; ctx.shadowBlur = 0; player.draw();
    ctx.restore();
    requestAnimationFrame(() => { update(); draw(); });
}

function showMsg(t) { msgEl.innerText = t; msgEl.style.display = 'block'; setTimeout(() => msgEl.style.display='none', 2000); }
function createExplosion(x, y, color, count) { for(let i=0; i<count; i++) particles.push({ x, y, vx: (Math.random()-0.5)*20, vy: (Math.random()-0.5)*20, life: 1, color, size: Math.random()*5 }); }

window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if((e.code === 'ArrowUp' || e.code === 'Space') && player.jumps < 2) { player.dy = CFG.JUMP; player.jumps++; }
    if(e.code === 'ArrowDown' || e.code === 'KeyS') { if(player.jumps > 0) player.dy = 25; else player.sliding = true; }
    if(e.code === 'KeyX') bullets.push({ x: player.x+50, y: player.y + (player.sliding?10:25) });
    if(e.code === 'KeyZ' && laserCharge >= 100) { isLaserFiring = true; laserCharge = 0; setTimeout(() => isLaserFiring = false, 3000); }
    if(e.code === 'ShiftLeft') if(player.dashFrame === 0) player.dashFrame = 15;
});
window.addEventListener('keyup', e => { keys[e.code] = false; if(e.code === 'ArrowDown' || e.code === 'KeyS') player.sliding = false; });
init(); draw();
</script>
</body>
</html>
